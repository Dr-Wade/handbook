# Point an environment tag at an image that already passed: re-tag, never rebuild.
#
#   promote:
#     uses: Dr-Wade/handbook/.github/workflows/promote-image.yml@workflows-v1
#     with: { service: api, from: ${{ github.sha }}, to: latest }
#
# The caller grants `packages: write`.
name: Promote image

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      from:
        description: Existing tag, usually the commit sha.
        type: string
        required: true
      to:
        description: Tag to point at it (latest, staging…).
        type: string
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag
        env:
          REPO: ${{ github.repository }}
          SERVICE: ${{ inputs.service }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          image="ghcr.io/${REPO,,}/${SERVICE,,}"
          docker buildx imagetools create --tag "$image:$TO" "$image:$FROM"
