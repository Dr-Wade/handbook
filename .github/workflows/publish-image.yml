# Build one image and push it to GHCR. Nothing else: no tests, no deploy.
#
# Called from a repo's release workflow after its full suite passed:
#
#   image:
#     needs: suite
#     uses: Dr-Wade/handbook/.github/workflows/publish-image.yml@workflows-v1
#     with: { service: api, tag: dev, target: api }
#
# The caller grants `packages: write`. The image is
# ghcr.io/<owner>/<repo>/<service>, lower-cased, tagged with the commit sha and
# the environment tag (dev, latest, …). Production is promoted from the sha
# tag with promote-image.yml, not rebuilt.
name: Publish image

on:
  workflow_call:
    inputs:
      service:
        description: Last path segment of the image name (api, web, app…).
        type: string
        required: true
      tag:
        description: Environment tag pushed next to the sha tag (dev, staging, latest).
        type: string
        required: true
      context:
        type: string
        default: "."
      file:
        description: Dockerfile path from the repo root.
        type: string
        default: Dockerfile
      target:
        description: Build stage, for a multi-target Dockerfile.
        type: string
        default: ""
      build-args:
        description: Newline-separated NAME=value. Not for secrets.
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64
    secrets:
      build-secrets:
        description: Newline-separated id=value, mounted with RUN --mount=type=secret.
        required: false
    outputs:
      image:
        value: ${{ jobs.publish.outputs.image }}
      digest:
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: name
        env:
          REPO: ${{ github.repository }}
          SERVICE: ${{ inputs.service }}
        run: echo "image=ghcr.io/${REPO,,}/${SERVICE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ inputs.tag }}
          # Links the package to the repo, so it inherits the repo's access.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
